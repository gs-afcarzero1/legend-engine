name: m2m-constructor-current-filter
title: "M2M child class filter reads through the constructed source"
description: |
  The parent maps elements to Box(ft=element). The child mapping has
  ~filter $src.ft.rank > 1 and reads only ft.id, so rank is needed by the
  filter alone. A same-typed aDecoy has a passing rank. The mapping runs over
  H2 through a ModelChainConnection; one element passes the filter and one is
  rejected, and the service test expects only the accepted child.
modelSources:
  model:
    root: m2m-constructor-current-filter
    files:
      - model.pure
features:
  - mapping:mapping
stores:
  - relational
complexity: basic
tags:
  - m2m
  - new-operator
  - source-tree
  - h2
