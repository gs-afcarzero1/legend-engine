name: m2m-constructor-current-child
title: "M2M carries a constructed map result into its child mapping"
description: |
  The parent maps elements to Box(ft=element). A separate child mapping reads
  ft.id and, after casting Box.ft from Leaf to Special, a nested property. A
  same-typed aDecoy holds different values. The mapping runs over H2 through a ModelChainConnection and
  one service test expects both children with the values of their own element.
modelSources:
  model:
    root: m2m-constructor-current-child
    files:
      - model.pure
features:
  - mapping:mapping
stores:
  - relational
complexity: basic
tags:
  - m2m
  - new-operator
  - source-tree
  - h2
