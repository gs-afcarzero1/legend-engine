name: m2m-constructor-current-inline
title: "M2M reads an assigned constructor property from its actual source"
description: |
  A transform reads ^Box(ft=$src.primary).ft.id within one expression.
  primary and aDecoy have the same class but different codes. The mapping runs
  over H2 through a ModelChainConnection, so a missing or misplaced id in the
  source tree cannot be hidden by a JSON reader that projects fields per class.
  There is one service test, expecting PRIMARY.
modelSources:
  model:
    root: m2m-constructor-current-inline
    files:
      - model.pure
features:
  - mapping:mapping
stores:
  - relational
complexity: basic
tags:
  - m2m
  - new-operator
  - source-tree
  - h2
