name: m2m-filter-subtype-cast
title: "M2M Class Mappings That Read Subtype Properties Through $src"
description: |
  A model-to-model mapping whose class mappings read properties that only a
  subtype of their ~src class declares, by casting $src: the root filter keeps
  only books whose FX desk matches, and the child trade mapping both filters on
  and outputs the currency pair of each trade. The source tree must request those
  subtype properties at the root and under the trades property, or the generated
  Java has no getter for them. The test executes the mapping over ModelStore data
  containing matching and non-matching books and trades.

modelSources:
  model:
    root: m2m-filter-subtype-cast
    files:
      - model.pure

features:
  - execution:test-data
  - mapping:mapping
stores: []
complexity: basic
tags:
  - m2m
  - filter
  - subtype
  - source-tree
